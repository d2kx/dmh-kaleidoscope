<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psychedelic Kaleidoscope</title>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Stats.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stats.js/16/Stats.min.js"></script>
    <style>
        :root {
            --ui-bg: rgba(10, 10, 10, 0.4);
            --ui-border: rgba(255, 255, 255, 0.1);
            --ui-text: #fff;
            --ui-blur: blur(10px);
            --primary: #ff00ff;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--ui-text);
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #ui-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 15px 25px;
            background: var(--ui-bg);
            backdrop-filter: var(--ui-blur);
            -webkit-backdrop-filter: var(--ui-blur);
            border: 1px solid var(--ui-border);
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: opacity 0.5s ease, transform 0.5s ease;
            opacity: 1;
            z-index: 10;
        }

        #ui-container.hidden {
            opacity: 0;
            transform: translate(-50%, 20px);
            pointer-events: none;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        label {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 120px;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--ui-text);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        button {
            background: transparent;
            border: 1px solid var(--ui-border);
            color: var(--ui-text);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* Customize Stats.js placement */
        #stats-container {
            position: absolute;
            top: 20px !important;
            right: 20px !important;
            left: auto !important;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        
        #stats-container.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="ui-container">
        <div class="control-group">
            <label for="speedSlider">Speed</label>
            <input type="range" id="speedSlider" min="0.1" max="5.0" step="0.1" value="1.0">
        </div>
        <button id="fullscreenBtn">Fullscreen</button>
    </div>

    <!-- Vertex Shader: Just passes coordinates for fullscreen plane -->
    <script id="vertexShader" type="x-shader/x-vertex">
        void main() {
            gl_Position = vec4(position, 1.0);
        }
    </script>

    <!-- Fragment Shader: The Psychedelic Magic -->
    <script id="fragmentShader" type="x-shader/x-fragment">
        uniform float time;
        uniform vec2 resolution;

        #define PI 3.14159265359

        // Smooth HSV to RGB conversion
        vec3 hsv2rgb(vec3 c) {
            vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
            vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
            return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
        }

        // 2D Rotation matrix
        mat2 rot(float a) {
            float s = sin(a), c = cos(a);
            return mat2(c, -s, s, c);
        }

        // Simple noise function
        float random(vec2 st) {
            return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);
        }

        void main() {
            // Normalize coordinates (-1 to 1) and correct aspect ratio
            vec2 uv = (gl_FragCoord.xy * 2.0 - resolution.xy) / min(resolution.x, resolution.y);
            vec2 uv0 = uv;

            // Output color
            vec3 finalColor = vec3(0.0);
            
            // --- Kaleidoscope Effect ---
            // Base number of segments, must be an integer to prevent tearing at the wrap boundary
            float segments = 8.0; 
            
            // To polar coordinates
            float angle = atan(uv.y, uv.x);
            float radius = length(uv);
            
            // Add global rotation
            angle += time * 0.2;

            // Fold space: Map angle to [0, 2*PI/segments] and bounce it
            float segmentAngle = 2.0 * PI / max(3.0, segments); // Ensure at least 3 segments
            angle = mod(angle, segmentAngle);
            angle = abs(angle - segmentAngle / 2.0);
            
            // Back to cartesian coordinates
            uv = radius * vec2(cos(angle), sin(angle));
            // --- End Kaleidoscope ---

            // Iterative fractal rendering
            float iterations = 4.0;
            for (float i = 0.0; i < iterations; i++) {
                // Zoom and warp space
                uv = fract(uv * 1.5) - 0.5;
                
                // Rotation varying by iteration and time
                uv *= rot(time * 0.3 + i * PI * 0.2);

                // Distance field
                float d = length(uv) * exp(-length(uv0));

                // Dynamic color palette
                // hue changes over time, distance, and iteration
                float hue = time * 0.1 + i * 0.15 + d * 0.4;
                // Saturation high for drug-induced look
                float sat = 0.8 + 0.2 * sin(time + i);
                // Value
                float val = 1.0;
                vec3 col = hsv2rgb(vec3(hue, sat, val));

                // Create rings/patterns
                d = sin(d * 8.0 + time * 1.5) / 8.0;
                d = abs(d);
                
                // Glow effect (inverse distance)
                // Add tiny offset to avoid division by zero
                d = pow(0.01 / (d + 0.001), 1.2);

                finalColor += col * d;
            }
            
            // Tone mapping and gamma correction to prevent blowing out completely white
            finalColor = 1.0 - exp(-finalColor);
            finalColor = pow(finalColor, vec3(1.0 / 2.2));
            
            // Vignette to darken edges
            float vignette = 1.0 - smoothstep(0.3, 2.5, length(uv0));
            finalColor *= vignette;

            // Add subtle noise to reduce banding and add texture
            finalColor += (random(uv0 + time) - 0.5) * 0.03;

            gl_FragColor = vec4(finalColor, 1.0);
        }
    </script>

    <script>
        // --- UI Setup ---
        const uiContainer = document.getElementById('ui-container');
        const speedSlider = document.getElementById('speedSlider');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        let speedMultiplier = 1.0;

        // Stats setup
        const stats = new Stats();
        stats.showPanel(0); // 0: fps, 1: ms, 2: mb, 3+: custom
        stats.dom.id = 'stats-container';
        document.body.appendChild(stats.dom);

        // UI Event Listeners
        speedSlider.addEventListener('input', (e) => {
            speedMultiplier = parseFloat(e.target.value);
        });

        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
                fullscreenBtn.textContent = 'Exit Fullscreen';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    fullscreenBtn.textContent = 'Fullscreen';
                }
            }
        });

        // Autohide UI
        let hideTimeout;
        const resetHideTimeout = () => {
            uiContainer.classList.remove('hidden');
            stats.dom.classList.remove('hidden');
            clearTimeout(hideTimeout);
            hideTimeout = setTimeout(() => {
                uiContainer.classList.add('hidden');
                stats.dom.classList.add('hidden');
            }, 3000); // Hide after 3 seconds of inactivity
        };

        document.addEventListener('mousemove', resetHideTimeout);
        document.addEventListener('touchstart', resetHideTimeout);
        resetHideTimeout(); // Initialize

        // --- Three.js Setup ---
        let camera, scene, renderer, material;
        let clock = new THREE.Clock();

        init();
        animate();

        function init() {
            // Camera setup (Orthographic for 2D plane)
            camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

            scene = new THREE.Scene();

            // Geometry: Fullscreen plane
            const geometry = new THREE.PlaneGeometry(2, 2);

            // Material: Custom Shader
            material = new THREE.ShaderMaterial({
                vertexShader: document.getElementById('vertexShader').textContent,
                fragmentShader: document.getElementById('fragmentShader').textContent,
                uniforms: {
                    time: { value: 0.0 },
                    resolution: { value: new THREE.Vector2(window.innerWidth * window.devicePixelRatio, window.innerHeight * window.devicePixelRatio) }
                }
            });

            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Handle resize
            window.addEventListener('resize', onWindowResize, false);
        }

        function onWindowResize() {
            renderer.setSize(window.innerWidth, window.innerHeight);
            material.uniforms.resolution.value.set(window.innerWidth * window.devicePixelRatio, window.innerHeight * window.devicePixelRatio);
        }

        function animate() {
            requestAnimationFrame(animate);
            stats.begin();

            // Update time based on speed multiplier
            const delta = clock.getDelta();
            material.uniforms.time.value += delta * speedMultiplier;

            renderer.render(scene, camera);
            
            stats.end();
        }
    </script>
</body>
</html>
